<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; color: #333; padding: 4px 8px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { margin-top: 16px; padding: 8px 16px; background: #4a86e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:disabled { background: #aaa; }
    #status { margin-top: 10px; font-style: italic; }
    .error { color: #cc0000; }
    .success { color: #137333; }
  </style>
</head>
<body>
  <form id="form">
    <label>Visiting School / Group *</label>
    <input type="text" id="group" required>

    <div class="row">
      <div>
        <label>Date *</label>
        <input type="date" id="date" required>
      </div>
      <div>
        <label>Grade Level</label>
        <input type="text" id="gradeLevel">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Start Time *</label>
        <input type="time" id="startTime" required>
      </div>
      <div>
        <label>End Time *</label>
        <input type="time" id="endTime" required>
      </div>
    </div>

    <label># of Visitors</label>
    <input type="number" id="numVisitors" min="1">

    <div class="row">
      <div>
        <label>Contact Name</label>
        <input type="text" id="contactName">
      </div>
      <div>
        <label>Contact Email</label>
        <input type="email" id="contactEmail">
      </div>
    </div>

    <label>Notes</label>
    <textarea id="notes" rows="2"></textarea>

    <button type="submit" id="submitBtn">Schedule Tour</button>
    <div id="status"></div>
  </form>

  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Saving…';

      const data = {
        group: document.getElementById('group').value,
        date: document.getElementById('date').value,
        gradeLevel: document.getElementById('gradeLevel').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        numVisitors: document.getElementById('numVisitors').value,
        contactName: document.getElementById('contactName').value,
        contactEmail: document.getElementById('contactEmail').value,
        notes: document.getElementById('notes').value
      };

      google.script.run
        .withSuccessHandler(function (tourId) {
          status.className = 'success';
          status.textContent = 'Saved as ' + tourId + '. You can close this window or add another.';
          document.getElementById('form').reset();
          btn.disabled = false;
        })
        .withFailureHandler(function (err) {
          status.className = 'error';
          status.textContent = err.message || String(err);
          btn.disabled = false;
        })
        .api_addTour(data);
    });
  </script>
</body>
</html>
