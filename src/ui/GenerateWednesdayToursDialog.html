<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; color: #333; padding: 4px 8px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { margin-top: 16px; padding: 8px 16px; background: #4a86e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:disabled { background: #aaa; }
    #status { margin-top: 10px; font-style: italic; white-space: pre-wrap; }
    .error { color: #cc0000; }
    .success { color: #137333; }
    .hint { color: #777; font-weight: normal; font-size: 11px; }
    p { color: #555; }
  </style>
</head>
<body>
  <p>Creates one Tour per week on Wednesday, 8:30–9:25 AM (matching the Tour Routes
  schedule). Any week that already has a tour on that date is skipped, so this is safe
  to re-run.</p>

  <form id="form">
    <label>Start Date <span class="hint">— rolled forward to the next Wednesday if not one</span></label>
    <input type="date" id="startDate" value="2026-09-30" required>

    <label># of Weeks</label>
    <input type="number" id="weeks" value="10" min="1" max="52" required>

    <button type="submit" id="submitBtn">Generate</button>
    <div id="status"></div>
  </form>

  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Generating…';

      const startDate = document.getElementById('startDate').value;
      const weeks = document.getElementById('weeks').value;

      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          let msg = 'Created ' + result.created.length + ' tour(s).';
          if (result.rolledForward) msg += ' (Start date rolled forward to the next Wednesday.)';
          if (result.skipped.length > 0) msg += '\nAlready had a tour, skipped: ' + result.skipped.join(', ');
          status.className = 'success';
          status.textContent = msg;
        })
        .withFailureHandler(function (err) {
          status.className = 'error';
          status.textContent = err.message || String(err);
          btn.disabled = false;
        })
        .api_generateWednesdayTours(startDate, weeks);
    });
  </script>
</body>
</html>
