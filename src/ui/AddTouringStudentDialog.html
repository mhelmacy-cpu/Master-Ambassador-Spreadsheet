<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; color: #333; padding: 4px 8px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { margin-top: 16px; padding: 8px 16px; background: #4a86e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:disabled { background: #aaa; }
    #status { margin-top: 10px; font-style: italic; }
    .error { color: #cc0000; }
    .success { color: #137333; }
    .hint { color: #777; font-weight: normal; font-size: 11px; }
  </style>
</head>
<body>
  <form id="form">
    <label>Tour *</label>
    <select id="tourId" required></select>

    <div class="row">
      <div>
        <label>First Name *</label>
        <input type="text" id="firstName" required>
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" id="lastName">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Grade</label>
        <input type="text" id="grade">
      </div>
      <div>
        <label>Current School</label>
        <input type="text" id="school">
      </div>
    </div>

    <label>Allergies / Medical Notes</label>
    <textarea id="medicalNotes" rows="2"></textarea>

    <div class="row">
      <div>
        <label>Chaperone Name</label>
        <input type="text" id="chaperoneName">
      </div>
      <div>
        <label>Chaperone Contact</label>
        <input type="text" id="chaperoneContact">
      </div>
    </div>

    <label>Notes</label>
    <textarea id="notes" rows="2"></textarea>

    <button type="submit" id="submitBtn">Add Student</button>
    <div id="status"></div>
  </form>

  <script>
    function loadTours() {
      google.script.run.withSuccessHandler(function (tours) {
        const sel = document.getElementById('tourId');
        sel.innerHTML = '';
        if (tours.length === 0) {
          sel.innerHTML = '<option value="">No tours scheduled yet</option>';
          return;
        }
        tours.forEach(function (t) {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.label;
          sel.appendChild(opt);
        });
      }).api_getTours();
    }
    loadTours();

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Saving…';

      const data = {
        tourId: document.getElementById('tourId').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        grade: document.getElementById('grade').value,
        school: document.getElementById('school').value,
        medicalNotes: document.getElementById('medicalNotes').value,
        chaperoneName: document.getElementById('chaperoneName').value,
        chaperoneContact: document.getElementById('chaperoneContact').value,
        notes: document.getElementById('notes').value
      };

      google.script.run
        .withSuccessHandler(function () {
          status.className = 'success';
          status.textContent = 'Student added.';
          document.getElementById('form').reset();
          loadTours();
          btn.disabled = false;
        })
        .withFailureHandler(function (err) {
          status.className = 'error';
          status.textContent = err.message || String(err);
          btn.disabled = false;
        })
        .api_addTouringStudent(data);
    });
  </script>
</body>
</html>
